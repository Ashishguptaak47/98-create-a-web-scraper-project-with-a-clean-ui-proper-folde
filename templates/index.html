<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Scraper Studio</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --accent-hover: #0284c7;
      --border: #334155; --text: #f8fafc; --muted: #94a3b8; --tag-bg: #0369a1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.5rem; color: var(--accent); display: flex; align-items: center; gap: .5rem; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    .row { display: flex; gap: 1rem; margin-bottom: 1rem; align-items: center; }
    .input-group { flex: 1; display: flex; flex-direction: column; gap: 0.35rem; }
    label { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
    input, select { background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.9rem; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    button { background: var(--accent); color: #000; border: none; padding: 0.65rem 1.25rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: var(--accent-hover); color: #fff; }
    button.secondary { background: #334155; color: var(--text); }
    button.secondary:hover { background: #475569; }
    .btn-row { display: flex; gap: 0.5rem; align-items: center; }
    .rule-item { display: grid; grid-template-columns: 1fr 1.5fr 1fr 40px; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
    .remove-btn { background: #ef4444; color: white; border: none; border-radius: 4px; height: 35px; cursor: pointer; }
    .meta-bar { display: flex; gap: 1.5rem; font-size: 0.9rem; color: var(--muted); margin-bottom: 1rem; }
    .meta-bar span strong { color: var(--text); }
    .result-section { display: none; }
    .tabs { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    .tab-btn { background: transparent; color: var(--muted); border-radius: 0; padding: 0.5rem 1rem; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    pre { background: #020617; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; max-height: 400px; color: #38bdf8; }
    .table-container { max-height: 400px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #0f172a; color: var(--muted); position: sticky; top: 0; }
    .loading { display: none; color: var(--accent); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🕷️ Web Scraper Studio</h1>
      <span style="font-size: 0.85rem; color: var(--muted);">FastAPI & BS4 Engine</span>
    </header>

    <div class="panel">
      <div class="row">
        <div class="input-group" style="flex: 3;">
          <label>Target URL</label>
          <input type="url" id="url" placeholder="https://news.ycombinator.com" required />
        </div>
        <div class="input-group" style="flex: 1;">
          <label>Preset</label>
          <select id="preset">
            <option value="custom">Custom Only</option>
            <option value="articles">Articles & Links</option>
            <option value="media">Images & Media</option>
            <option value="seo">SEO & OpenGraph</option>
          </select>
        </div>
      </div>

      <label style="display:block; margin-bottom: 0.5rem;">Custom Selectors</label>
      <div id="rules-list"></div>
      <div class="btn-row" style="margin-top: 0.5rem; justify-content: space-between;">
        <button type="button" class="secondary" onclick="addRule()">+ Add Rule</button>
        <div class="btn-row">
          <span id="loading-indicator" class="loading">Scraping... Please wait</span>
          <button type="button" onclick="runScrape()">Scrape Target</button>
        </div>
      </div>
    </div>

    <div id="result-panel" class="panel result-section">
      <div class="meta-bar">
        <span>Status: <strong id="res-status">-</strong></span>
        <span>Time: <strong id="res-time">-</strong>s</span>
        <span>Items: <strong id="res-count">-</strong></span>
        <span>Title: <strong id="res-title">-</strong></span>
      </div>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('table')">Table View</button>
        <button class="tab-btn" onclick="switchTab('json')">JSON View</button>
        <div style="margin-left: auto; display: flex; gap: 0.5rem;">
          <button class="secondary" onclick="exportData('json')">Download JSON</button>
          <button class="secondary" onclick="exportData('csv')">Download CSV</button>
        </div>
      </div>
      <div id="tab-table" class="table-container">
        <table id="results-table"><thead><tr><th>Field</th><th>Extracted Value</th></tr></thead><tbody></tbody></table>
      </div>
      <div id="tab-json" style="display: none;">
        <pre><code id="json-viewer"></code></pre>
      </div>
    </div>
  </div>

  <script>
    let lastResult = null;

    function addRule(name = '', selector = '', attribute = '') {
      const container = document.getElementById('rules-list');
      const div = document.createElement('div');
      div.className = 'rule-item';
      div.innerHTML = `
        <input placeholder="Field Label (e.g. Title)" value="${name}" class="r-name" />
        <input placeholder="CSS Selector (e.g. .titleline > a)" value="${selector}" class="r-sel" />
        <input placeholder="Attribute (opt, e.g. href)" value="${attribute}" class="r-attr" />
        <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
      `;
      container.appendChild(div);
    }

    addRule('Headings', 'h1, h2', '');

    function switchTab(mode) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-table').style.display = mode === 'table' ? 'block' : 'none';
      document.getElementById('tab-json').style.display = mode === 'json' ? 'block' : 'none';
    }

    async function runScrape() {
      const url = document.getElementById('url').value.trim();
      if (!url) return alert('Please enter a target URL.');
      const indicator = document.getElementById('loading-indicator');
      indicator.style.display = 'inline';

      const ruleNodes = document.querySelectorAll('.rule-item');
      const rules = Array.from(ruleNodes).map(node => ({
        name: node.querySelector('.r-name').value.trim(),
        selector: node.querySelector('.r-sel').value.trim(),
        attribute: node.querySelector('.r-attr').value.trim() || null
      })).filter(r => r.name && r.selector);

      const payload = {
        url,
        preset: document.getElementById('preset').value,
        rules
      };

      try {
        const resp = await fetch('/api/scrape', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) throw new Error(await resp.text());
        const data = await resp.json();
        renderResults(data);
      } catch (err) {
        alert('Scraping error: ' + err.message);
      } finally {
        indicator.style.display = 'none';
      }
    }

    function renderResults(res) {
      lastResult = res;
      document.getElementById('result-panel').style.display = 'block';
      document.getElementById('res-status').textContent = res.status_code;
      document.getElementById('res-time').textContent = res.elapsed_seconds;
      document.getElementById('res-count').textContent = res.total_items;
      document.getElementById('res-title').textContent = res.title || 'N/A';
      document.getElementById('json-viewer').textContent = JSON.stringify(res.data, null, 2);

      const tbody = document.querySelector('#results-table tbody');
      tbody.innerHTML = '';
      for (const [key, values] of Object.entries(res.data)) {
        values.forEach(val => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td style="font-weight:600; color:var(--accent);">${key}</td><td>${escapeHtml(String(val))}</td>`;
          tbody.appendChild(tr);
        });
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function exportData(format) {
      if (!lastResult) return;
      let blob, filename;
      if (format === 'json') {
        blob = new Blob([JSON.stringify(lastResult, null, 2)], { type: 'application/json' });
        filename = 'scrape_result.json';
      } else {
        const rows = [['Field', 'Value']];
        for (const [key, values] of Object.entries(lastResult.data)) {
          values.forEach(v => rows.push([key, `"${String(v).replace(/"/g, '""')}"`]));
        }
        const csvContent = rows.map(r => r.join(',')).join('\n');
        blob = new Blob([csvContent], { type: 'text/csv' });
        filename = 'scrape_result.csv';
      }
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }
  </script>
</body>
</html>
